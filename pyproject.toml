[project]
name = "deterministic-trading-engine"
version = "0.1.0"
description = "BTC/ETH/SOL trading research pipeline: zone-geometry EV, walk-forward validation, rank-based admission"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

# Корневой проект — workspace-обвязка: инструменты разработки и общий тестовый
# стек. Рантайм-зависимости распределены по членам workspace (uv workspaces).
# См. legacy/dev_docs/tz/TZ-00-roadmap.md п. «Монорепозиторий».
dependencies = [
    "lightgbm",
    "catboost",  # ensemble member: YetiRank (ordered boosting)
    "pandas>=2.2,<3",  # validated on 2.3.3; pandas 3 str-dtype breaks feature encode
    "scikit-learn>=1.8.0",
    "xgboost",
]

[tool.uv.workspace]
members = ["engine", "ta", "dsl"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
    "mypy==2.1.0",
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.15.20",
]

[[tool.uv.index]]
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
default = true

# CUDA-сборки torch для GPU-обучения (RTX 3050): PyPI/приватный индекс отдают
# CPU-варианты на Windows, CUDA-колёса живут только на download.pytorch.org.
# Linux не тянем: там PyPI-torch уже с CUDA (TZ-06 п.11).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]

# Держим torch на 2.4.1 (та же версия, что в lockfile на Linux/CI; >=2.4.1 из
# ai/pyproject.toml иначе взял бы 2.6.0+cu124 и потянул новую загрузку ~2ГБ).
[tool.uv]
constraint-dependencies = ["torch==2.4.1"]

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [".venv/", "legacy/", ".mypy_cache/", "__pycache__/"]
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined/unused names)
    "Q",    # quotes
    "D",    # pydocstyle
    "N",    # pep8-naming
    "I",    # import order (replaces isort)
    "B",    # bugbear (real bug patterns)
    "RUF",  # unicode/ambiguity guards (EN-only discipline, TZ-14)
]
ignore = [
    "E203",
    "D100",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
]
preview = true

[tool.ruff.lint.per-file-ignores]
# Tests: docstrings not required, but E/F/B/RUF/I still apply
# (EN-only discipline covers tests too, TZ-14 item 2.1).
# RUF069 is relaxed here: exact-literal float checks (== 0.0, == 1.0) in
# tests are intentional for IEEE-semantics assertions; new tests should
# prefer pytest.approx (see legacy/dev_docs/testing_convention.md s.4).
"**/tests/**" = ["D", "RUF069", "E501"]
"test_*.py" = ["D", "RUF069"]
"conftest.py" = ["D", "RUF069"]
# Research-grade zones (former scripts/, pre-dating the library
# standards): readability fixes welcome, but docstrings, line length
# and style pedantry are not enforced there.  The library core
# (infra/features/structure/sim/backtest/model/metrics) is fully clean.
"engine/experiments/**" = ["E501", "D", "B905", "RUF069", "B007", "N", "E402", "E741", "E702"]
"engine/datasets/**" = ["E501", "B905", "RUF069", "B007"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
docstring-code-format = true
# Must match the global line-length: a longer value would make `ruff
# format` itself reintroduce E501 violations inside docstring examples.
docstring-code-line-length = 79

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-single-line = false
force-wrap-aliases = true
lines-after-imports = 2
lines-between-types = 1
combine-as-imports = true

[tool.mypy]
# Single strict profile for the engine library: every public function
# annotated, no implicit Any returns.  Research-grade zones and tests are
# exempt below (unannotated by design; ruff F/E9 still guards them).
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
exclude = ["legacy", ".venv", "ta/tests", "data", "runs"]
disallow_untyped_defs = true
warn_return_any = true
check_untyped_defs = true

# Research-grade zones (former scripts/): unannotated by design, style is
# not library-grade (see ruff per-file-ignores).  Typed checking adds noise
# only - suppressed entirely; ruff still catches real bugs there (F, E9).
# Tests: fixtures/tests stay untyped on purpose.
# Vendored ta/ and the dsl/ workspace package: checked by their own
# suites and standards; they are only pulled in here via imports.
[[tool.mypy.overrides]]
module = [
    "engine.experiments.*",
    "engine.datasets.*",
    "engine.tests.*",
    "ta.*",
    "dsl.*",
]
ignore_errors = true

[tool.pytest.ini_options]
# Single source of pytest config: per-package pytest.ini files are removed.
# Runs identically from the root and from a package:
#   uv run pytest                          # whole monorepo
pythonpath = ["."]
testpaths = ["engine/tests", "dsl/tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --strict-markers -m \"not deprecated\""
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    # --- cross-cutting markers ---
    "unit: fast isolated tests",
    "integration: tests touching services/network/files",
    "slow: > 5s tests (opt-in via -m slow)",
    "deprecated: scheduled for removal (excluded by default)",
    # --- service markers (per-service separation, TZ-14 п.2.3) ---
    # Applied automatically by the root conftest.py path hook; do not
    # mark tests manually.
    "ta: belongs to the vendored dte-ta package",
    "engine: belongs to the dte-engine package",
    "dsl: belongs to the dte-dsl package",
    # --- domain markers (inherited from the former per-package inis) ---
    "candle: [ta] candle-pattern indicators",
    "custom: [ta] custom indicators",
    "momentum: [ta] momentum indicators",
    "overlap: [ta] overlap indicators",
    "statistics: [ta] statistics indicators",
    "trend: [ta] trend indicators",
    "volatility: [ta] volatility indicators",
    "volume: [ta] volume indicators",
    "performance: [ta] performance/speed tests",
    "tokenizer: [dsl] tokenizer module",
    "parser: [dsl] parser module",
    "ast: [dsl] AST serialization",
    "interpreter: [dsl] interpreter module",
    "manifest: [dsl] manifest and validator",
    "provider: [dsl] provider implementations",
    "evaluate: [dsl] evaluate_dsl entry point",
    "error: [dsl] error-handling tests",
    "async_test: [dsl] asynchronous tests",
    "with_providers: [dsl] tests using mock/real providers",
    "without_providers: [dsl] tests without providers",
]

filterwarnings = [
    # Third-party noise we cannot influence:
    "ignore:The PyTorch API of nested tensors is in prototype stage.*:UserWarning",
    "ignore:Type google._upb._message.*:DeprecationWarning",
    "ignore::DeprecationWarning:numba.*",
    "ignore::PendingDeprecationWarning",
    # TA-Lib is optional; its absence is a normal fallback, not an error:
    "ignore:TA-Lib not installed.*:UserWarning:ta\\.src\\.external",
]
