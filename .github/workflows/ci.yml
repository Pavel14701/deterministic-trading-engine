name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-packages
      - name: Lint (library, tests, dsl)
        # scripts/ keeps its research-grade style; only F-class is enforced:
        # real bugs (undefined names, syntax) block, style does not.
        run: uv run ruff check engine tests dsl
      - name: Lint (scripts, F-class only)
        run: uv run ruff check scripts --select F,E9
      - name: Type check
        run: uv run mypy engine
      - name: Tests
        run: uv run pytest tests dsl/tests
