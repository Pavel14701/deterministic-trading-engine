name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-packages
      - name: Lint (library, tests, dsl subset)
        run: uv run ruff check ai tests dsl
      - name: Lint (scripts, F-class only)
        run: uv run ruff check scripts --select F,E9
      - name: Type check
        run: uv run mypy ai
      - name: Tests
        run: uv run pytest tests
