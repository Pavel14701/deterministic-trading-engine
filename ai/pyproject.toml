[project]
name = "dte-ai"
version = "0.1.0"
description = "Research library: features, candidates, MTF panels, LGBM ranker, state machine, OKX sources"
requires-python = ">=3.12"
dependencies = [
    "niquests>=3.20",
    "numpy>=2.0",
    "polars>=1.42.1",
    "pyyaml>=6.0.3",
    "torch>=2.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = false
